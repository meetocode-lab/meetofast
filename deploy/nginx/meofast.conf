# Nginx Reverse Proxy Configuration for Meofast
# Place in /etc/nginx/sites-available/meofast.conf and symlink to sites-enabled/

upstream meofast_web {
    server 127.0.0.1:4780;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-studio.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-studio.example.com;

    ssl_certificate     /etc/letsencrypt/live/api-studio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-studio.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MeofastTLS:10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large API request payloads / collection imports (50 MB)
    client_max_body_size 50m;

    location / {
        proxy_pass         http://meofast_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
